name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tylxr59/mapme

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --include=optional
      - name: Validate version tag
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME.slice(1); if (p.version !== tag) throw new Error('package.json version '+p.version+' does not match '+tag)"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Smoke-test published architectures
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in amd64 arm64; do
            port=$([ "$platform" = amd64 ] && echo 4300 || echo 4301)
            docker run -d --name "mapme-${platform}" \
              --platform "linux/${platform}" \
              -p "${port}:3000" \
              "${IMAGE_NAME}:${version}"
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format='{{.State.Health.Status}}' "mapme-${platform}")"
              [ "$status" = healthy ] && break
              if [ "$status" = unhealthy ]; then
                docker logs "mapme-${platform}"
                exit 1
              fi
              sleep 2
            done
            test "$(docker inspect --format='{{.State.Health.Status}}' "mapme-${platform}")" = healthy
            curl --fail "http://127.0.0.1:${port}/healthz"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/")" = 303
            docker rm -f "mapme-${platform}"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
