name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tylxr59/mapme

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --include=optional
      - name: Validate version tag
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME.slice(1); if (p.version !== tag) throw new Error('package.json version '+p.version+' does not match '+tag)"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Smoke-test published architectures
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in amd64 arm64; do
            port=$([ "$platform" = amd64 ] && echo 4300 || echo 4301)
            docker run -d --name "mapme-${platform}" \
              --platform "linux/${platform}" \
              -p "${port}:3000" \
              "${IMAGE_NAME}:${version}"
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format='{{.State.Health.Status}}' "mapme-${platform}")"
              [ "$status" = healthy ] && break
              if [ "$status" = unhealthy ]; then
                docker logs "mapme-${platform}"
                exit 1
              fi
              sleep 2
            done
            test "$(docker inspect --format='{{.State.Health.Status}}' "mapme-${platform}")" = healthy
            curl --fail "http://127.0.0.1:${port}/healthz"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/")" = 303
            docker rm -f "mapme-${platform}"
          done
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
